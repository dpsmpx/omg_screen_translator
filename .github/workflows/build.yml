name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        id: apk
        run: |
          name="GameScreenTranslator-1.0.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: GameScreenTranslator-apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Publish APK to Releases
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "${{ steps.apk.outputs.name }}" \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "APK собран автоматически из ветки \`${{ github.ref_name }}\` (коммит ${{ github.sha }}). Скачайте файл .apk ниже и установите на телефон."
